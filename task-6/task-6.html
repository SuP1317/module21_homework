<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Галерея изображений JSONPlaceholder</h1>
        
        <div class="controls">
            <div class="input-group">
                <label for="pageInput">Номер страницы (1-10)</label>
                <input type="number" id="pageInput" min="1" max="10" placeholder="Введите число от 1 до 10">
            </div>
            
            <div class="input-group">
                <label for="limitInput">Лимит (1-10)</label>
                <input type="number" id="limitInput" min="1" max="10" placeholder="Введите число от 1 до 10">
            </div>
            
            <button id="requestBtn">Запрос</button>
        </div>
        
        <div id="errorMessage" class="error"></div>
        
        <div id="loading" class="loading">Загрузка изображений...</div>
        
        <div id="gallery" class="gallery"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
